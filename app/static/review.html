<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>장비 개체 검토</title>
<style>body{font:16px sans-serif;background:#14202b;color:#eee;margin:24px}button,input,select{padding:8px;margin:4px}main{display:flex;gap:24px}aside{width:260px;max-height:75vh;overflow:auto}aside button{width:96%;overflow:hidden}canvas{max-width:100%;background:#111;touch-action:none}section{flex:1}label{display:inline-block}#regions input{width:150px}.note{color:#a9c8df}</style>
<h1>장비 개체 검토</h1><p class="note">중복을 제외한 이미지·대표 프레임입니다. 영역을 드래그하고 임시 그룹을 입력하세요. 장비명은 확인 근거가 있을 때 확정합니다.</p>
<select id="kind"><option value="">전체</option><option value="image">이미지</option><option value="frame">영상 프레임</option></select>
<button id="prev">이전</button><button id="next">다음</button><span id="count"></span>
<main><aside id="list"></aside><section><p id="source"></p><canvas id="canvas"></canvas><div><label><input type="checkbox" id="unusable">사용 불가</label><button id="save">검토 저장</button><span id="status"></span></div><div id="regions"></div></section></main>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let offset=0,current=null,regions=[],picture=new Image(),start=null,dirty=false;
async function api(url,options){const r=await fetch(url,options);if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){try{const data=await api(`/api/assets?offset=${offset}&kind=${$('kind').value}`);$('count').textContent=`${offset+1}–${Math.min(offset+40,data.total)} / ${data.total}`;$('list').replaceChildren();data.items.forEach(a=>{let b=document.createElement('button');b.textContent=`${a.kind} ${a.source.split('/').pop()} ${a.frame??''}`;b.onclick=()=>select(a);$('list').append(b)})}catch(e){$('status').textContent=e.message}}
async function select(a){if(dirty&&!confirm('저장하지 않은 변경을 버릴까요?'))return;try{let r=await api(`/api/assets/${a.id}/review`);current=a;regions=r.regions;$('unusable').checked=r.unusable;$('source').textContent=a.source+(a.frame!==undefined?` · 프레임 ${a.frame}`:'');picture.onload=()=>{canvas.width=picture.width;canvas.height=picture.height;draw();fields()};picture.src=`/api/assets/${a.id}/image`;dirty=false;$('status').textContent=''}catch(e){$('status').textContent=e.message}}
function draw(){ctx.drawImage(picture,0,0);ctx.lineWidth=3;ctx.strokeStyle='#48ffb2';ctx.fillStyle='#48ffb2';regions.forEach((r,i)=>{ctx.strokeRect(r.x,r.y,r.width,r.height);ctx.fillText(`${i+1} ${r.group}`,r.x,r.y+14)})}
function fields(){$('regions').replaceChildren();regions.forEach((r,i)=>{const row=document.createElement('div');row.append(document.createTextNode(`개체 ${i+1} `));for(const [key,title] of [['group','임시 그룹'],['label','장비명'],['reviewer','확인자'],['evidence','확인 근거']]){let input=document.createElement('input');input.placeholder=title;input.value=r[key]||'';input.oninput=()=>{r[key]=input.value;dirty=true;draw()};row.append(input)}let label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=r.confirmed;check.onchange=()=>{r.confirmed=check.checked;dirty=true};label.append(check,document.createTextNode('명칭 확정'));row.append(label);let del=document.createElement('button');del.textContent='영역 삭제';del.onclick=()=>{regions.splice(i,1);dirty=true;fields();draw()};row.append(del);$('regions').append(row)})}
function point(e){const b=canvas.getBoundingClientRect();return [Math.max(0,Math.min(canvas.width,Math.round((e.clientX-b.left)*canvas.width/b.width))),Math.max(0,Math.min(canvas.height,Math.round((e.clientY-b.top)*canvas.height/b.height)))]}
canvas.onpointerdown=e=>{if(!current)return;start=point(e);canvas.setPointerCapture(e.pointerId)};
canvas.onpointerup=e=>{if(!start)return;let end=point(e),x=Math.min(start[0],end[0]),y=Math.min(start[1],end[1]),width=Math.abs(start[0]-end[0]),height=Math.abs(start[1]-end[1]);start=null;if(width<3||height<3)return;regions.push({x,y,width,height,group:'',label:'',reviewer:'',evidence:'',confirmed:false});dirty=true;draw();fields()};
$('unusable').onchange=()=>dirty=true;
$('save').onclick=async()=>{if(!current)return;try{await api(`/api/assets/${current.id}/review`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({regions,unusable:$('unusable').checked})});dirty=false;$('status').textContent='저장 완료'}catch(e){$('status').textContent=e.message}};
$('prev').onclick=()=>{offset=Math.max(0,offset-40);load()};$('next').onclick=()=>{offset+=40;load()};$('kind').onchange=()=>{offset=0;load()};window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};load();
</script></html>
